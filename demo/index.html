<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Preview | AjayaDesign — See What Your Site Could Look Like</title>
  <meta name="description" content="Live demo preview of a custom-built website for your business. See what AjayaDesign can build for you." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #0A0A0F; }
    #preview-banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
      background: linear-gradient(135deg, #12121A 0%, #1a1a2e 100%);
      border-bottom: 1px solid #1E1E2E;
      padding: 12px 20px;
      display: flex; align-items: center; justify-content: center; gap: 16px;
      flex-wrap: wrap;
      transition: transform 0.3s ease;
    }
    #preview-banner.hidden-banner { transform: translateY(-100%); }
    #preview-banner .banner-text { color: #e5e7eb; font-size: 13px; text-align: center; }
    #preview-banner .biz-name { color: #FF4654; font-weight: 700; }
    #preview-banner a.cta-btn {
      background: #C41E3A; color: white; padding: 8px 20px; border-radius: 8px;
      font-size: 12px; font-weight: 700; text-decoration: none; text-transform: uppercase;
      letter-spacing: 0.05em; white-space: nowrap; transition: background 0.2s;
    }
    #preview-banner a.cta-btn:hover { background: #ED1C24; }
    #preview-banner button.dismiss {
      background: none; border: 1px solid #333; color: #888; padding: 6px 12px;
      border-radius: 6px; font-size: 11px; cursor: pointer; white-space: nowrap;
      font-family: inherit; transition: all 0.2s;
    }
    #preview-banner button.dismiss:hover { border-color: #666; color: #ccc; }
    #demo-frame { width: 100%; height: 100vh; border: none; transition: margin-top 0.3s ease; }
    #demo-frame.with-banner { margin-top: 52px; height: calc(100vh - 52px); }
    #no-template {
      display: none; color: #e5e7eb; text-align: center; padding: 120px 20px;
    }
    #no-template h1 { font-size: 2rem; font-weight: 700; margin-bottom: 16px; color: white; }
    #no-template p { color: #9ca3af; max-width: 500px; margin: 0 auto 24px; font-size: 14px; }
    #no-template a { color: #FF4654; text-decoration: underline; }
    .show-toggle {
      position: fixed; top: 8px; right: 8px; z-index: 100000;
      background: #C41E3A; color: white; border: none; padding: 6px 12px;
      border-radius: 6px; font-size: 11px; cursor: pointer; font-family: inherit;
      font-weight: 700; display: none; transition: opacity 0.2s;
    }
  </style>
</head>
<body>

  <div id="preview-banner">
    <p class="banner-text">
      This is a preview for <span class="biz-name" id="biz-name-display">Your Business</span>. Want the real thing?
    </p>
    <a href="/contact/" class="cta-btn">Contact Us →</a>
    <button class="dismiss" id="dismiss-btn" aria-label="Dismiss banner">✕ Dismiss</button>
  </div>

  <button class="show-toggle" id="show-banner-btn" aria-label="Show preview banner">↓ Show Banner</button>

  <iframe id="demo-frame" class="with-banner" title="Website preview demo"></iframe>

  <div id="no-template">
    <h1>Template Not Found</h1>
    <p>We don't have a demo for that business type yet. Choose from: restaurant, auto, salon, contractor, or retail.</p>
    <p><a href="/contact/">Contact us</a> and we'll build something custom for you.</p>
  </div>

  <script>
    const templates = {
      restaurant: '/works/food-bev/snoball-dude/',
      food: '/works/food-bev/snoball-dude/',
      auto: '/works/automotive/apex-auto/',
      automotive: '/works/automotive/apex-auto/',
      mechanic: '/works/automotive/apex-auto/',
      salon: '/works/ecommerce/velvet-bloom/',
      beauty: '/works/ecommerce/velvet-bloom/',
      boutique: '/works/ecommerce/velvet-bloom/',
      retail: '/works/ecommerce/velvet-bloom/',
      contractor: '/works/services/nextstep-es/',
      construction: '/works/services/nextstep-es/',
      trades: '/works/services/nextstep-es/',
      services: '/works/services/nextstep-es/',
    };

    const params = new URLSearchParams(window.location.search);
    const business = (params.get('business') || '').toLowerCase().trim();
    const name = params.get('name') || 'Your Business';

    document.getElementById('biz-name-display').textContent = name;
    document.title = `Preview for ${name} | AjayaDesign`;

    const templateUrl = templates[business];
    const frame = document.getElementById('demo-frame');
    const noTemplate = document.getElementById('no-template');

    if (templateUrl) {
      frame.src = templateUrl;
      frame.style.display = 'block';
      noTemplate.style.display = 'none';
    } else if (business) {
      frame.style.display = 'none';
      noTemplate.style.display = 'block';
    } else {
      // No params — show a default (restaurant)
      frame.src = templates.restaurant;
      frame.style.display = 'block';
      noTemplate.style.display = 'none';
    }

    const banner = document.getElementById('preview-banner');
    const dismissBtn = document.getElementById('dismiss-btn');
    const showBtn = document.getElementById('show-banner-btn');

    dismissBtn.addEventListener('click', () => {
      banner.classList.add('hidden-banner');
      frame.classList.remove('with-banner');
      showBtn.style.display = 'block';
    });

    showBtn.addEventListener('click', () => {
      banner.classList.remove('hidden-banner');
      frame.classList.add('with-banner');
      showBtn.style.display = 'none';
    });
  </script>
</body>
</html>
