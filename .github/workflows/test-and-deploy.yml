name: Test & Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────
  # Job 1 — Run Playwright + Axe tests
  # ──────────────────────────────────────
  test:
    name: Playwright & Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: JS syntax & lint check
        run: |
          echo "🔍 Checking all JavaScript files for syntax errors..."
          ERRORS=0
          for f in $(find . -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./automation/*" -not -path "./_site/*"); do
            if ! node -c "$f" 2>/dev/null; then
              echo "❌ SYNTAX ERROR: $f"
              node -c "$f" 2>&1 || true
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "💥 $ERRORS JavaScript file(s) have syntax errors!"
            exit 1
          fi
          echo "✅ All JS files pass syntax check"

      - name: Critical auth flow check
        run: |
          echo "🔐 Checking Firebase auth configuration..."
          # Verify firebase-config.js exists and has required fields
          if [ ! -f js/firebase-config.js ]; then
            echo "❌ js/firebase-config.js missing!"
            exit 1
          fi
          node -e "
            eval(require('fs').readFileSync('js/firebase-config.js', 'utf8'));
            const c = global.window ? global.window.__firebaseConfig : null;
            // Config loads via IIFE into window — check the file at least parses
            console.log('✅ firebase-config.js parses OK');
          " 2>/dev/null || echo "⚠️ firebase-config.js uses browser globals (expected)"
          
          # Check portal-auth.js doesn't reference undeclared variables outside IIFE
          if grep -Pn '^\s*(var\s+|const\s+|let\s+|auth\.|db\.|isAdmin)' 3D-print/portal/portal-auth.js | grep -v '^\s*//' | head -5; then
            echo "⚠️ Check above lines — ensure no IIFE-scoped variables leak to global"
          fi
          
          # Verify ADMIN_EMAIL is set
          if ! grep -q "ADMIN_EMAIL" 3D-print/portal/portal-auth.js; then
            echo "❌ ADMIN_EMAIL not found in portal-auth.js!"
            exit 1
          fi
          echo "✅ Auth flow checks passed"

      - name: Run tests
        run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ──────────────────────────────────────
  # Job 2 — Deploy to GitHub Pages
  #   Only runs on push to main & after
  #   tests pass
  # ──────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site directory
        run: |
          mkdir _site
          # Copy all site content, exclude non-site files
          rsync -a --exclude='.git' \
                   --exclude='.github' \
                   --exclude='.venv' \
                   --exclude='node_modules' \
                   --exclude='automation' \
                   --exclude='skills' \
                   --exclude='playwright-report' \
                   --exclude='test-results' \
                   --exclude='.openclaw' \
                   --exclude='data' \
                   --exclude='__pycache__' \
                   --exclude='*.py' \
                   --exclude='*.pyc' \
                   --exclude='*.pickle' \
                   --exclude='*.log' \
                   --exclude='AGENTS.md' \
                   --exclude='BOOTSTRAP.md' \
                   --exclude='HEARTBEAT.md' \
                   --exclude='IDENTITY.md' \
                   --exclude='SOUL.md' \
                   --exclude='TOOLS.md' \
                   --exclude='USER.md' \
                   --exclude='MEMORY.md' \
                   --exclude='.env' \
                   --exclude='.env.*' \
                   --exclude='_site' \
                   ./ _site/
          touch _site/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
